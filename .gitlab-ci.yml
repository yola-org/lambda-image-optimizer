# Project pipeline: image-optimizer Lambda. All logic lives in the shared templates repo.

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: "tech1212145/ci-templates"
    ref: master
    file:
      - templates/version.yml
      - templates/gradle.yml
      - templates/docker.yml
      - templates/infra-bump.yml

stages:
  - test
  - secret-detection
  - build
  - release

variables:
  # Run Secret Detection in MR pipelines as well as branch pipelines.
  AST_ENABLE_MR_PIPELINES: "true"

# Branch + MR pipelines, no duplicates, no tags
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Release jobs run only on main, unless VERSION_SKIP is enabled,
# and only when application or Docker build inputs have changed.
.release-on-app-change:
  rules:
    - if: $VERSION_SKIP == "true"
      when: never

    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*

        # Gradle build configuration
        - build.gradle
        - build.gradle.kts
        - settings.gradle
        - settings.gradle.kts
        - gradle.properties
        - gradlew
        - gradlew.bat
        - gradle/**/*

        # Additional build logic
        - buildSrc/**/*

        # Docker build inputs
        - Dockerfile
        - .dockerignore

    - when: never

# Release jobs only run on the default branch (main), i.e. after a merge.
# VERSION_SKIP=true disables every versioned release job consistently.
.default-branch-only:
  rules:
    - if: $VERSION_SKIP == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitLab's Secret-Detection job defaults to the `test` stage. `needs: []`
# lets it run immediately instead of waiting for the test stage.
secret_detection:
  stage: secret-detection
  needs: []

test:
  extends: .gradle-test

build:
  extends: .gradle-build
  needs:
    # VERSION comes from this job's dotenv artifact; `test` makes sure a
    # broken test suite never reaches the image build or the release jobs.
    - job: version:calculate
      artifacts: true
      optional: true
    - job: test

docker-build-push:
  extends: [.docker-build-push-ecr, .release-on-app-change]
  variables:
    DOCKER_IMAGE_NAME: "vestio/image-optimizer"

git-tag:
  extends: [.version:tag, .release-on-app-change]
  needs:
    - job: version:calculate
      artifacts: true
    - job: docker-build-push

update-aws-infra:
  extends: [.update-infra-image-tag, .release-on-app-change]
  needs:
    - job: version:calculate
      artifacts: true
    - job: docker-build-push
  variables:
    INFRA_PROJECT_PATH: "aws-infra"
    INFRA_COMPONENT: "image-optimizer"
    INFRA_TF_VAR_KEY: "image_optimizer_image_tag"
