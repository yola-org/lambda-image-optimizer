# Project pipeline: image-optimizer Lambda. All logic lives in the shared templates repo.

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: "tech1212145/ci-templates"
    ref: master
    file:
      - templates/version.yml
      - templates/gradle.yml
      - templates/docker.yml
      - templates/git-tag.yml
      - templates/infra-bump.yml

stages:
  - prepare
  - test
  - secret-detection
  - build
  - release

# Branch + MR pipelines, no duplicates, no tags
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Release jobs only run on the default branch (main), i.e. after a merge
.default-branch-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

calculate-version:
  extends: .version

test:
  extends: .gradle-test

build:
  extends: .gradle-build

docker-build-push:
  extends: [.docker-build-push-ecr, .default-branch-only]
  variables:
    DOCKER_IMAGE_NAME: "vestio/image-optimizer"

git-tag:
  extends: [.git-tag, .default-branch-only]
  needs:                          # strict: no "optional", docker must have succeeded
    - job: calculate-version
      artifacts: true
    - job: docker-build-push

update-aws-infra:
  extends: [.update-infra-image-tag, .default-branch-only]
  needs:
    - job: calculate-version
      artifacts: true
    - job: docker-build-push
    - job: git-tag
  variables:
    INFRA_PROJECT_PATH: "aws-infra"
    INFRA_COMPONENT: "image-optimizer"
    INFRA_TF_VAR_KEY: "image_optimizer_image_tag"