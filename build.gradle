
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // AWS Lambda
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.2'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.1'

    // AWS SDK v2
    implementation platform('software.amazon.awssdk:bom:2.31.22')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:secretsmanager'
    runtimeOnly 'org.postgresql:postgresql:42.7.14'

    // Message parsing and WebP ImageIO writer (includes Linux native binaries)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'com.github.gotson:webp-imageio:0.2.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Disable the standard JAR
tasks.named('jar') {
    enabled = false
}

// Generate a fat JAR with all dependencies
tasks.named('shadowJar') {
    archiveClassifier.set('all')
    mergeServiceFiles()
}

// Build generates the fat JAR
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
