import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'application'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'com.github.spotbugs' version '6.5.13'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // AWS Lambda
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.2'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.1'

    // AWS SDK v2
    implementation platform('software.amazon.awssdk:bom:2.31.22')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:secretsmanager'
    runtimeOnly 'org.postgresql:postgresql'

    // Message parsing and WebP ImageIO writer (includes Linux native binaries)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'com.github.gotson:webp-imageio:0.2.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    finalizedBy tasks.named('jacocoTestReport')
}

spotless {
    java {
        trimTrailingWhitespace()
        endWithNewline()
    }
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
    }
}

spotbugs {
    ignoreFailures = true
}

tasks.withType(SpotBugsTask).configureEach {
    reports.create('html') {
        required = true
    }
}

application {
    mainClass = 'com.vestio.imageoptimizer.ImageOptimizerApplication'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('jar') {
    destinationDirectory = layout.buildDirectory.dir('app')
}

tasks.register('stageLambda', Sync) {
    from(tasks.named('jar'))
    from(configurations.runtimeClasspath)
    into(layout.buildDirectory.dir('libs'))
}

tasks.named('build') {
    dependsOn tasks.named('stageLambda')
}
